    <template id="project-ra"><div class="modal-main"><p class="eyebrow">01 / Programming & control systems</p><h2>6-axis Virtual Robotic Arm </h2><p class="modal-lede"></p><img class="modal-feature-image" src="" alt=""><h3>The challenge</h3><p></p><h3>The approach</h3><p></p><h3>Results</h3><p></p></div><aside class="modal-sidebar"><h3>Skills acquired</h3><ul><li>Point-cloud preprocessing</li><li>Object clustering and tracking</li><li>Deep learning workflows</li><li>Data pipeline design</li><li>Model evaluation</li><li>Performance analysis</li></ul><h3>Tools</h3><ul><li>Python</li><li>LiDAR data</li><li>DGCNN</li><li>NumPy / ML tooling</li></ul></aside></template>
    <template id="project-nac"><div class="modal-main"><p class="eyebrow">02 / Perception & machine learning</p><h2>LiDAR-Based Animal Recognition</h2><p class="modal-lede">Joint clustering, tracking and temporal classification from point-cloud signatures.</p><img class="modal-feature-image" src="images/NAC/5 objects close 1 with arrows.png" alt="Annotated objects in a LiDAR scene"><h3>The challenge</h3><p>Recognizing animals from LiDAR point clouds means working with sparse, noisy and sometimes incomplete observations. The project investigated how detections could be associated over time and classified in real-world field conditions.</p><h3>The approach</h3><p>I developed a pipeline that combined object clustering and tracking with point-cloud classification and temporal evidence. A major focus was balancing classification performance with robustness across noisy and incomplete detections.</p><h3>Results</h3><p>The system achieved strong classification accuracy on clean ground-truth crops and solid end-to-end performance once integrated into the full detection and tracking pipeline.</p></div><aside class="modal-sidebar"><h3>Skills acquired</h3><ul><li>Point-cloud preprocessing</li><li>Object clustering and tracking</li><li>Deep learning workflows</li><li>Data pipeline design</li><li>Model evaluation</li><li>Performance analysis</li></ul><h3>Tools</h3><ul><li>Python</li><li>LiDAR data</li><li>DGCNN</li><li>NumPy / ML tooling</li></ul></aside></template>
    <template id="project-hbd"><div class="modal-main"><p class="eyebrow">03 / Embedded system integration</p><h2>Honey Badger Detection Subsystem</h2><p class="modal-lede">Connecting detection software to a useful physical response.</p><img class="modal-feature-image" src="images/HBD/Detection Hardware.jpg" alt="Honey badger detection system hardware"><h3>The system</h3><p>This subsystem connected image capture, machine learning inference, user interface updates and hardware deterrent control into one practical workflow.</p><p>The objective was to support reliable field operation by linking software detections with a physical response mechanism and clear user feedback.</p></div><aside class="modal-sidebar"><h3>Skills acquired</h3><ul><li>System integration</li><li>Embedded hardware interfacing</li><li>ML API integration</li><li>UI feedback design</li><li>Testing and debugging</li></ul><h3>Tools</h3><ul><li>Python</li><li>Embedded hardware</li><li>Detection pipeline</li></ul></aside></template>
    <template id="project-mm"><div class="modal-main"><p class="eyebrow">04 / Robotics & control</p><h2>Micromouse Maze Solver</h2><p class="modal-lede">Autonomous navigation in a compact robot.</p><img class="modal-feature-image" src="images/MM/3D viewer.png" alt="Micromouse robot render"><h3>The challenge</h3><p>Designed and programmed an autonomous micro-robot capable of exploring and solving a maze. The project required integrating sensing, control logic and constrained physical design.</p><p>A key challenge was developing reliable behavior under limited hardware and budget constraints while still achieving robust navigation performance.</p></div><aside class="modal-sidebar"><h3>Skills acquired</h3><ul><li>Control logic</li><li>Robot navigation</li><li>Simulation</li><li>Embedded thinking</li><li>Design under constraints</li></ul><h3>Tools</h3><ul><li>MATLAB Simulink</li><li>Micro-robotics</li></ul></aside></template>

<script>
const menuButton = document.querySelector('.menu-toggle');
const menu = document.querySelector('.site-menu');

function setMenu(open) {
  document.body.classList.toggle('menu-open', open);
  menuButton?.setAttribute('aria-expanded', String(open));
  menuButton?.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
  if (open) menu?.querySelector('a')?.focus();
  else menuButton?.focus();
}

menuButton?.addEventListener('click', () => setMenu(!document.body.classList.contains('menu-open')));
menu?.addEventListener('click', event => { if (event.target.closest('a')) setMenu(false); });

const modal = document.getElementById('projectModal');
const modalPanel = modal?.querySelector('.project-modal__panel');
let opener = null;

function closeProject() {
  if (!modal || modal.getAttribute('aria-hidden') === 'true') return;
  modal.setAttribute('aria-hidden', 'true');
  document.body.classList.remove('modal-open');
  document.getElementById('modalBody').replaceChildren();
  opener?.focus();
}

document.querySelectorAll('[data-project]').forEach(button => button.addEventListener('click', () => {
  const template = document.getElementById(button.dataset.project);
  if (!template || !modal) return;
  opener = button;
  document.getElementById('modalBody').replaceChildren(template.content.cloneNode(true));
  modal.setAttribute('aria-hidden', 'false');
  document.body.classList.add('modal-open');
  modalPanel.focus();
}));

modal?.querySelector('.project-modal__close')?.addEventListener('click', closeProject);
modal?.addEventListener('click', event => { if (event.target === modal) closeProject(); });
document.addEventListener('keydown', event => {
  if (event.key === 'Escape') {
    if (modal?.getAttribute('aria-hidden') === 'false') closeProject();
    else if (document.body.classList.contains('menu-open')) setMenu(false);
  }
  if (event.key === 'Tab' && modal?.getAttribute('aria-hidden') === 'false') {
    const focusable = [...modal.querySelectorAll('a[href], button:not([disabled]), [tabindex="0"]')];
    if (!focusable.length) return;
    const first = focusable[0], last = focusable.at(-1);
    if (event.shiftKey && (document.activeElement === first || document.activeElement === modalPanel)) { event.preventDefault(); last.focus(); }
    else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
  }
});
</script>
